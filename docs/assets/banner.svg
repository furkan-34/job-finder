<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Job Finder: an AI assistant for your job search">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/><stop offset="0.55" stop-color="#120a35"/><stop offset="1" stop-color="#06162e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#d946ef" stop-opacity="0.35"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6366f1" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowB)"/>
  <g fill="#e0e7ff" fill-opacity="0.8">
    <circle cx="90" cy="60" r="1.5"/><circle cx="240" cy="260" r="1.2"/><circle cx="470" cy="40" r="1.4"/>
    <circle cx="760" cy="280" r="1.3"/><circle cx="980" cy="50" r="1.6"/><circle cx="1110" cy="240" r="1.2"/><circle cx="640" cy="30" r="1"/>
  </g>
  <g transform="translate(110 160)" fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round">
    <circle cx="0" cy="-10" r="52"/>
    <path d="M38 28 L78 68"/>
    <path d="M-22 -10 L-6 6 L24 -28" stroke-width="9"/>
  </g>
  <text x="230" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#neon)" letter-spacing="-1">Job Finder</text>
  <text x="234" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#c7d2fe">Your AI assistant for the whole job search</text>
  <text x="234" y="250" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#22d3ee" fill-opacity="0.9">find  ›  check  ›  score  ›  write CV  ›  apply  ›  follow up</text>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="url(#neon)" stroke-opacity="0.6" stroke-width="2"/>
</svg>
