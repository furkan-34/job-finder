[project]
name = "jobfinder"
version = "0.1.0"
description = "Personal AI-powered job finder"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.3.0",
    "jsonschema>=4.23",
    "onnxruntime>=1.20",
    "pypdf>=5",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.20",
    "typst>=0.14",
]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder"]
