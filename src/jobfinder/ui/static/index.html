<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Job Finder</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--side:#fbfbfc;--line:#e4e7ec;--line-2:#d0d5dd;
  --text:#101828;--mute:#5d6679;--dim:#8a93a6;--hover:#f2f4f7;
  --accent:#2f5bea;--accent-ink:#fff;--accent-soft:#eaf0ff;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--surface:#16191f;--side:#13161b;--line:#262a33;--line-2:#363b46;
  --text:#e7e9ee;--mute:#a0a7b5;--dim:#737b8b;--hover:#1d2129;
  --accent:#6d8dff;--accent-ink:#0b1020;--accent-soft:#1b2440;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent);text-underline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:15px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:12px}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--mute);font-weight:500}
.nav:hover{background:var(--hover);color:var(--text)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .n{margin-left:auto;font-size:12px;color:var(--dim)}
.nav:focus-visible{outline:2px solid var(--accent)}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--dim)}

main{min-width:0;padding:24px 28px 48px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:550;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:20px;width:min(380px,calc(100% - 32px));box-shadow:0 16px 40px rgba(16,24,40,.18)}
dialog::backdrop{background:rgba(16,24,40,.4)}
dialog h2{margin:0 0 4px;font-size:16px}dialog p{margin:0 0 14px;color:var(--mute)}
.bl{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-weight:550}
.brow{display:flex;gap:16px}
.bprev{font-weight:550;color:var(--text)!important}
.bf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
a.tl{color:inherit;text-decoration:none}
a.tl:hover{color:var(--accent);text-decoration:underline}
textarea.in{max-width:420px;resize:vertical;font-family:inherit}
.btn.del{margin-left:6px;padding:4px 7px;color:var(--mute)}
.btn.del:hover,.btn.danger:hover{color:#b42318;border-color:#b42318}
.btn.tick{margin-left:6px;padding:4px 7px}
.btn:disabled{opacity:.5;cursor:default}
.needs-search .btn{pointer-events:none}

/* Jobs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:8px 12px;color:var(--mute);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{margin-left:6px;font-size:12px;color:var(--dim);font-weight:500}
.tab:focus-visible{outline:2px solid var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:0 10px;height:34px;color:var(--mute)}
.field input,.field select{border:0;background:transparent;outline:0;height:100%;color:var(--text)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.q{flex:1;min-width:200px;max-width:340px}.field.q input{width:100%}
.field.num input{width:44px}
.filters .clear{all:unset;cursor:pointer;color:var(--accent);font-size:13px;margin-left:4px}
.bulk{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:8px;background:var(--accent-soft);border-radius:var(--r);color:var(--accent);font-weight:550}
.bulk .sp{flex:1}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{position:sticky;top:0;background:var(--surface);font-size:12px;font-weight:600;color:var(--mute);z-index:1}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--text)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.on{background:var(--accent-soft)}
td.t{white-space:normal;min-width:220px}
td.t b{font-weight:600;display:block}
td.t span{color:var(--mute);font-size:13px}
td.r,th.r{text-align:right}
td.ck,th.ck{width:36px;padding-right:0}
td.no,th.no{width:44px;color:var(--mute);text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.score{font-weight:600}
.score.hi{color:#0f8a4f}.score.mid{color:#b26a00}.score.lo{color:var(--mute)}
@media (prefers-color-scheme:dark){.score.hi{color:#4fd18b}.score.mid{color:#f0b14a}}
.src{color:var(--mute);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:550;background:var(--b,var(--hover));color:var(--c,var(--mute))}
.warn{color:#b54708;margin-left:6px;vertical-align:-3px}
.muted{color:var(--dim)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.foot-t{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px;padding:10px 2px}

/* Drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(16,24,40,.08);
  transform:translateX(100%);visibility:hidden;transition:transform .22s cubic-bezier(.16,1,.3,1),visibility .22s;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:17px;line-height:1.3}
.dh p{margin:2px 0 0;color:var(--mute)}
.dh .x{margin-left:auto}
.db{padding:16px 20px;overflow:auto;flex:1}
.db h3{font-size:12px;color:var(--mute);font-weight:600;margin:18px 0 8px}
.db h3:first-child{margin-top:0}
dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:0}
dt{color:var(--mute)}dd{margin:0}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:inline-flex;gap:6px;align-items:center}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.docs li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.docs li:last-child{border-bottom:0}
.dn small{display:block;color:var(--mute);font-size:12.5px;font-family:var(--mono)}
.applybox{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.applybox .row{display:flex;gap:8px;flex-wrap:wrap}
.applybox small{color:var(--mute)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:4px 0;color:var(--mute)}
.tl li b{color:var(--text);font-weight:550;min-width:110px}
.alert{background:#fef3e2;color:#93370d;border-radius:8px;padding:8px 12px;font-size:13px}
@media (prefers-color-scheme:dark){.alert{background:#3a2410;color:#f7c58c}}

/* Setup */
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:760px}
.fr{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:start}
.fr:last-of-type{border-bottom:0}
.fr label,.fr .lb{font-weight:550}
.fr small{display:block;color:var(--mute);font-weight:400;font-size:12.5px;margin-top:2px}
.in{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 10px;width:100%;max-width:320px}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:8px;align-items:center;font-weight:400}
.checks .tag{font-size:12px;color:var(--dim);margin-left:4px}
input.switch{position:relative;width:36px;height:20px;flex:none;appearance:none;-webkit-appearance:none;background:var(--line-2);border-radius:999px;cursor:pointer;transition:background .15s;margin:0}
input.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
input.switch:checked{background:var(--accent)}input.switch:checked::after{transform:translateX(16px)}
.formfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 10px 10px}
.status{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mini th,.mini td{padding:8px 10px}
.mini input.in{max-width:none;padding:5px 8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,10px);opacity:0;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:550;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
code{font-family:var(--mono);font-size:12.5px;background:var(--hover);padding:1px 5px;border-radius:4px}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 0}.side .foot{display:none}.nav .n{display:none}
  main{padding:16px}
  .fr{grid-template-columns:1fr;gap:8px}
  .hide-s{display:none}
  .field.q{max-width:none}
}
@media (prefers-reduced-motion:reduce){.drawer,.toast,.switch,input.switch::after{transition:none}}

/* Terminal dock */
.term{position:fixed;left:220px;right:0;bottom:0;height:min(46vh,460px);background:#0d1017;border-top:1px solid var(--line-2);z-index:15;display:none;flex-direction:column;box-shadow:0 -12px 32px rgba(16,24,40,.18)}
.term.open{display:flex}
.th{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#151922;color:#c9d1e0;font-size:13px;border-bottom:1px solid #232937}
.ttabs{display:flex;gap:4px;min-width:0;overflow-x:auto}
.ttab{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-radius:7px;cursor:pointer;color:#98a2b3;font:600 13px var(--mono);white-space:nowrap;border:1px solid transparent}
.ttab:hover{background:#1d2230;color:#e7e9ee}
.ttab[aria-selected="true"]{background:#0d1017;border-color:#2f3646;color:#fff}
.ttab:focus-visible{outline:2px solid var(--accent)}
.ttab .dot{width:7px;height:7px;border-radius:50%;background:#667085}
.ttab .dot.run{background:#12b76a;animation:pulse 1.4s ease-in-out infinite}
.ttab .dot.bad{background:#f04438}
.ttab .cl{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;color:#98a2b3}
.ttab .cl:hover{background:#2f3646;color:#fff}
.ttab .cl svg{width:12px;height:12px}
.tstat{color:#98a2b3;font-size:12.5px;white-space:nowrap}
.xbox{position:absolute;inset:0;padding:8px 6px 4px 10px;display:none}
.xbox.on{display:block}
.th .sp{flex:1}
@keyframes pulse{50%{opacity:.35}}
.th button{all:unset;cursor:pointer;padding:3px 10px;border-radius:6px;border:1px solid #2f3646;color:#e7e9ee}
.th button:hover{background:#232937}
.th button:focus-visible{outline:2px solid var(--accent)}
.th button.danger{border-color:#7a2b25;color:#fda29b}
#xt{flex:1;min-height:0;position:relative}
.hint{padding:6px 14px;font-size:12px;color:#8b94a8;background:#10131a;border-top:1px solid #232937}
body.term-open main{padding-bottom:calc(min(46vh,460px) + 24px)}
.nav .live{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#12b76a}
.banner{background:#fef3e2;color:#93370d;border-radius:8px;padding:10px 14px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.banner{background:#3a2410;color:#f7c58c}}
@media (max-width:760px){.term{left:0}}
@media (prefers-reduced-motion:reduce){.ttab .dot.run{animation:none}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card small{display:block;color:var(--mute);font-size:12px}.card b{font-size:22px;font-weight:600}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.chart h2{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);font-weight:400}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--k)}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;border-bottom:1px solid var(--line-2)}
.bar{flex:1;min-width:2px;display:flex;flex-direction:column-reverse;height:100%;justify-content:flex-start;cursor:default}
.bar span{display:block;background:var(--k);min-height:0}
.bar span:last-child{border-radius:3px 3px 0 0}
.axis{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:4px}
:root{--k1:#2f5bea;--k2:#9db3f2;--k3:#0f9d8a}
@media (prefers-color-scheme:dark){:root{--k1:#6d8dff;--k2:#3a4a80;--k3:#2fc4ae}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.two .tbl{margin:0}
td.n{text-align:right;white-space:nowrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-jobs" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>
  <symbol id="i-setup" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>

  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></symbol>
  <symbol id="i-cost" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15v3M12 9v9M17 12v6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>

</defs></svg>

<div class="app">
  <nav class="side" aria-label="Menu">
    <div class="brand"><i>JF</i>Job Finder</div>
    <button class="nav" data-page="jobs"></button>
    <button class="nav" data-page="cost"></button>
    <button class="nav" data-page="setup"></button>
    <div class="foot" id="foot"></div>
  </nav>
  <main id="page"></main>
</div>
<aside class="drawer" id="drawer" aria-label="Posting details" aria-hidden="true"></aside>
<section class="term" id="term" aria-label="Terminal">
  <div class="th"><div class="ttabs" id="ttabs" role="tablist" aria-label="Terminal sessions"></div><span class="sp"></span>
    <span id="tstat" class="tstat"></span><button id="tstop" class="danger">Stop</button><button id="tclose" aria-label="Hide terminal panel">Hide</button></div>
  <div id="xt"></div>
  <div class="hint">This is a real Claude Code session. Answer its questions here. Nothing is sent or submitted without your confirmation.</div>
</section>
<dialog id="batch" aria-labelledby="bt">
  <form method="dialog" id="bform">
    <h2 id="bt">Open batch</h2>
    <p id="bdesc"></p>
    <label class="bl">Data source<select id="bsrc" class="in"></select></label>
    <div class="brow"><label class="bl">Part<input id="bpart" class="in" type="number" min="1" style="width:90px"></label>
      <label class="bl">Max postings per part<input id="bmax" class="in" type="number" min="1" max="100" style="width:110px"></label></div>
    <p id="bprev" class="bprev"></p>
    <div class="bf"><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="bgo" value="go">Open tabs</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
const TOKEN = document.querySelector('meta[name="token"]').content;
let S = {jobs:[], settings:{fetch:{data_sources:[], date_posted:"anyTime", exclude_words:[]}, score:{}, cv:{}, apply:{}}, searches:[], sources:[],
         profile:{exists:false}, cv_files:[], checks:{}, terminal:{available:false}, apify_token:false, sent_today:0, commands:[]};

const STAGES = {
  unchecked:["Awaiting check","#f2f4f7","#475467"], blocked:["Blocked","#fee4e2","#b42318"], filtered_out:["Filtered out","#f2f4f7","#667085"],
  unscored:["Unscored","#f2f4f7","#475467"], new:["Scored","#f2f4f7","#344054"], shortlist:["Shortlist","#eaf0ff","#2f5bea"],
  approved:["Needs CV","#f4ebff","#6941c6"], cv_ready:["CV ready","#ecfdf3","#067647"], applied:["Applied","#fff6e5","#b54708"], interview:["Interview","#e0f2fe","#0b5cad"],
  response:["Replied","#dcfae6","#05603a"], no_response:["No reply","#f2f4f7","#667085"], rejected:["Rejected","#fee4e2","#b42318"]
};
const TABS = [
  ["all","All",null], ["new","New",["unchecked","unscored","new"]], ["shortlist","Shortlist",["shortlist"]],
  ["cv","CV",["approved","cv_ready"]], ["applied","Applied",["applied"]], ["interview","Interview",["interview"]],

const OPENABLE = ["unscored", "new", "shortlist", "approved", "cv_ready"];  // not applied yet, with or without a score
let batchSrc = "APIFY_REED_SCRAPER", batchMax = 40, batchPart = 1, batchMode = "open";
const batchPool = src => S.jobs.filter(j => j.data_source === src && OPENABLE.includes(j.stage) && (j.url || j.apply_url))
  .sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || (a.id > b.id ? 1 : -1));   // the same order every time, so parts do not overlap; unscored last
function batchSlice(){
  const max = Math.max(1, Math.min(100, parseInt($("#bmax").value, 10) || 1)), part = Math.max(1, parseInt($("#bpart").value, 10) || 1);
  const pool = batchPool($("#bsrc").value), from = (part - 1) * max;
  return {pool, max, part, from, todo: pool.slice(from, from + max)};
}
function batchPreview(){
  const {pool, from, todo} = batchSlice();
  $("#bprev").textContent = todo.length ? `Postings ${from + 1} to ${from + todo.length} of ${pool.length}, highest score first.` : `No postings there: this source has ${pool.length}.`;
  $("#bgo").disabled = !todo.length;
}
function openBatch(mode){
  batchMode = mode;
  const open = S.jobs.filter(j => j.data_source && OPENABLE.includes(j.stage) && (j.url || j.apply_url));
  const names = new Map(open.map(j => [j.data_source, j.source]));
  if (!names.size) return toast("No posting is waiting for an application.");
  if (!names.has(batchSrc)) batchSrc = [...names.keys()][0];
  $("#bt").textContent = mode === "apply" ? "Batch apply" : "Open batch";
  $("#bdesc").textContent = mode === "apply"
    ? "Opens the postings in new tabs and marks them as applied right away, so part 1 is always the next batch. Postings you have not applied to only."
    : "Opens the postings you have not applied to in new tabs. Part 2 with 40 postings is the postings 41 to 80.";
  $("#bgo").textContent = mode === "apply" ? "Open and mark applied" : "Open tabs";
  $("#bsrc").innerHTML = [...names].map(([k, l]) => `<option value="${esc(k)}" ${k === batchSrc ? "selected" : ""}>${esc(l)} (${open.filter(j => j.data_source === k).length})</option>`).join("");
  $("#bmax").value = batchMax; $("#bpart").value = mode === "apply" ? 1 : batchPart;
  batchPreview();
  $("#batch").showModal();
}
async function runBatch(){
  const {max, part, todo} = batchSlice();
  batchSrc = $("#bsrc").value; batchMax = max; if (batchMode === "open") batchPart = part;
  $("#batch").close();
  const opened = [];
  for (const j of todo) { const w = window.open(j.url || j.apply_url, "_blank"); if (w) { w.opener = null; opened.push(j.id); } }
  const blocked = todo.length - opened.length;

  render();
  toast(blocked ? `The browser blocked ${blocked} of ${todo.length} tabs: allow pop-ups for this page and try again.`
    : batchMode === "apply" ? `Opened ${opened.length} and marked them as applied.` : `Opened ${opened.length} posting${opened.length === 1 ? "" : "s"}, highest score first.`);
}

function doAct(kind, id){

function bulk(kind){

}

  if (cRange === "all") Object.keys(days).sort().forEach(d => list.push(d));
  else for (let i = nd - 1; i >= 0; i--) list.push(new Date(Date.now() - i * 864e5).toLocaleDateString("sv"));

  const grows = Object.entries(groups).map(([k, v]) => ({k, ...sumRuns(v)})).sort((a, b) => b.tokens - a.tokens).slice(0, 50);
  const shown = rs.slice(0, 200);
  $("#page").innerHTML = head + (C.error ? "" : `
    <div class="filters">
      <label class="field">Period <select id="crange">${[["7","Last 7 days"],["14","Last 14 days"],["30","Last 30 days"],["all","All time"]].map(([v, l]) => `<option value="${v}" ${v === cRange ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field q">${ic("search")}<input id="cq" type="search" placeholder="Filter by command, agent or posting" value="${esc(cQ)}" aria-label="Filter"></label>
    </div>
    <div class="cards">
      <div class="card"><small>Total tokens</small><b>${nf(tot.tokens)}</b></div>
      <div class="card"><small>Estimated cost</small><b>${usd(tot.cost)}</b></div>

    try { await api("/api/safety-model", {}); } finally { await reload(); setupPage(); } toast("Safety model installed"); }));

async function saveForm(){

const sessionOf = id => sessions().find(x => x.id === id);
function label(x){
  const same = sessions().filter(y => y.command === x.command);
  return (CMD_LABEL[x.command] || x.command) + (same.length > 1 ? ` #${same.indexOf(x) + 1}` : "");
}
function sendTo(id, path, body){ const t = T.get(id); if (!t) return Promise.resolve();
  t.queue = (t.queue || Promise.resolve()).then(() => api(path, {id, ...body})).catch(() => {}); return t.queue; }
function makeTab(id){
  if (T.has(id)) return T.get(id);
  const box = document.createElement("div"); box.className = "xbox on"; $("#xt").append(box);  // visible while xterm measures it
  const term = new Terminal({cursorBlink:true, fontSize:13, fontFamily:'ui-monospace,"SF Mono",Menlo,Consolas,monospace', scrollback:5000,
    theme:{background:"#0d1017", foreground:"#e7e9ee", cursor:"#e7e9ee", selectionBackground:"#33415c"}});
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(box);
  term.onData(d => sendTo(id, "/api/term/input", {data:d}));
  term.onResize(({cols, rows}) => { const x = sessionOf(id); if (x?.running) sendTo(id, "/api/term/resize", {cols, rows}); });
  const t = {term, fit, box, es:null};
  T.set(id, t); stream(id, t); return t;
}
function stream(id, t){
  t.es = new EventSource(`/api/term/stream?token=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(id)}&from=0`);
  t.es.onmessage = e => { const bin = atob(e.data); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); t.term.write(buf); };
  t.es.addEventListener("exit", () => { t.es.close(); t.es = null; act(async () => { await reload("jobs"); renderTabs(); if (page === "jobs") { nav(); jobsPage(); } }); });
}
function renderTabs(){
  const list = sessions();
  $("#ttabs").innerHTML = list.map(x => `<button class="ttab" role="tab" data-id="${x.id}" aria-selected="${x.id === active}">
      <span class="dot ${x.running ? "run" : x.exit_code ? "bad" : ""}"></span>${esc(label(x))}<span class="cl" data-close="${x.id}" role="button" aria-label="Close ${esc(label(x))}" title="Close">${ic("x")}</span></button>`).join("");
  $("#ttabs").querySelectorAll(".ttab").forEach(b => b.onclick = e => { if (e.target.closest("[data-close]")) return; activate(b.dataset.id); });
  $("#ttabs").querySelectorAll("[data-close]").forEach(c => c.onclick = e => { e.stopPropagation(); closeTab(c.dataset.close); });
  const x = sessionOf(active);
  $("#tstat").textContent = !x ? "" : x.running ? "Running" : x.exit_code === 0 ? "Finished" : `Stopped (exit ${x.exit_code})`;
  $("#tstop").style.display = x?.running ? "" : "none";
  if (!running() && poll) { clearInterval(poll); poll = null; }
}
function activate(id){
  active = id;
  T.forEach((t, k) => t.box.classList.toggle("on", k === id));
  showTerm(true); renderTabs();
  const t = T.get(id); if (t) requestAnimationFrame(() => { t.fit.fit(); t.term.focus(); });
}
function showTerm(open){
  $("#term").classList.toggle("open", open); document.body.classList.toggle("term-open", open);
  if (open && active) { const t = T.get(active); if (t) requestAnimationFrame(() => t.fit.fit()); }
}
function syncTabs(){
  sessions().forEach(x => makeTab(x.id));
  T.forEach((t, id) => { if (!sessionOf(id)) dropTab(id); });
  if (!sessionOf(active)) active = sessions().length ? sessions()[sessions().length - 1].id : null;
}
function dropTab(id){ const t = T.get(id); if (!t) return; t.es?.close(); t.term.dispose(); t.box.remove(); T.delete(id); }
async function startTerm(cmd){
  if (!S.terminal.available) return toast(S.terminal.reason || "Terminal unavailable");
  const cur = T.get(active), size = cur ? {cols:cur.term.cols, rows:cur.term.rows} : {cols:110, rows:26};
  showTerm(true);
  await act(async () => {
    const r = await api("/api/term/start", {command:cmd, ...size});
    S.terminal = {available:r.available, reason:r.reason, sessions:r.sessions};
    syncTabs(); activate(r.id); nav();
    if (!poll) poll = setInterval(() => act(async () => { await reload("jobs"); renderTabs(); if (page === "jobs" && !document.activeElement?.closest("#page input, #page select")) { nav(); jobsPage(); } }), 6000);
  });
}
async function closeTab(id){
  await act(async () => {
    const r = await api("/api/term/close", {id});
    S.terminal = {available:r.available, reason:r.reason, sessions:r.sessions};
    dropTab(id); syncTabs();
    if (active) activate(active); else showTerm(false);
    renderTabs(); nav();
  });
}
$("#tstop").onclick = () => act(async () => { const r = await api("/api/term/stop", {id:active}); S.terminal = {available:r.available, reason:r.reason, sessions:r.sessions}; renderTabs(); nav(); });
$("#tclose").onclick = () => showTerm(false);
new ResizeObserver(() => { const t = T.get(active); if (t && $("#term").classList.contains("open")) t.fit.fit(); }).observe($("#xt"));

/* ---------------- Boot ---------------- */
function render(){ nav(); renderTabs(); page === "jobs" ? jobsPage() : page === "cost" ? costPage() : setupPage(); }
(async () => {
  await act(() => reload());
  render();
  if (sessions().length) { syncTabs(); activate(active); if (running()) poll = setInterval(() => act(async () => { await reload("jobs"); renderTabs(); if (page === "jobs" && !document.activeElement?.closest("#page input, #page select")) { nav(); jobsPage(); } }), 6000); }
})();
addEventListener("focus", () => act(async () => { await reload("jobs"); if (page === "jobs") { nav(); jobsPage(); } }));
</script>
</body>
